<!-- src/assets/images/login-illustration.svg -->
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background shapes -->
  <rect x="0" y="0" width="200" height="200" fill="#f0f9ff" />
  <circle cx="50" cy="50" r="80" fill="url(#grad2)" opacity="0.1"/>
  <path d="M 200,0 L 120,0 C 180,80 120,180 200,200 Z" fill="url(#grad1)" opacity="0.1" />

  <!-- Main Illustration -->
  <g transform="translate(30 40) scale(0.7)">
    <!-- Main Panel -->
    <rect x="10" y="10" width="180" height="150" rx="10" fill="white" stroke="#e0e7ff" stroke-width="1.5" />

    <!-- Header -->
    <rect x="10" y="10" width="180" height="25" rx="10" ry="10" fill="#f1f5f9" />
    <circle cx="25" cy="22.5" r="4" fill="#cbd5e1" />
    <circle cx="38" cy="22.5" r="4" fill="#cbd5e1" />
    <circle cx="51" cy="22.5" r="4" fill="#cbd5e1" />

    <!-- Side Menu -->
    <rect x="20" y="45" width="45" height="105" rx="5" fill="#f8fafc" />
    <rect x="28" y="55" width="30" height="5" rx="2" fill="url(#grad1)" />
    <rect x="28" y="68" width="20" height="5" rx="2" fill="#e2e8f0" />
    <rect x="28" y="81" width="30" height="5" rx="2" fill="#e2e8f0" />
    <rect x="28" y="94" width="25" height="5" rx="2" fill="#e2e8f0" />
    <rect x="28" y="135" width="30" height="5" rx="2" fill="#e2e8f0" />

    <!-- Chart Area -->
    <!-- Bar Chart -->
    <rect x="80" y="110" width="15" height="30" rx="2" fill="#a5f3fc" />
    <rect x="105" y="90" width="15" height="50" rx="2" fill="url(#grad1)" />
    <rect x="130" y="100" width="15" height="40" rx="2" fill="#a5f3fc" />
    <rect x="155" y="75" width="15" height="65" rx="2" fill="url(#grad1)" opacity="0.7"/>
    <line x1="75" y1="140" x2="175" y2="140" stroke="#d1d5db" stroke-width="1.5" />

    <!-- Stat Card -->
    <rect x="80" y="50" width="90" height="30" rx="5" fill="white" stroke="#e0e7ff" stroke-width="1" />
    <circle cx="92" cy="65" r="6" fill="url(#grad1)" />
    <rect x="105" y="58" width="40" height="5" rx="2" fill="#d1d5db" />
    <rect x="105" y="68" width="25" height="5" rx="2" fill="#e2e8f0" />

     <!-- Floating Icon -->
    <g transform="translate(150, 40)">
      <circle cx="0" cy="0" r="15" fill="white" filter="url(#shadow)" />
      <path d="M -5 -7 L 5 -7 L 0 0 L -5 -7 M -5 2 L 5 2 L 5 9 L -5 9 Z" fill="url(#grad1)" />
    </g>
  </g>

  <filter id="shadow">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
  </filter>
</svg>
