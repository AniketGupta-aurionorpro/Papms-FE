<div class="auth-centered-page">
  <div class="auth-content">

    <!-- Header -->
    <div class="text-center mb-6" appFadeIn>
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-amber-900/50 text-amber-400 mb-4 border border-amber-700">
        <ion-icon name="shield-half-outline" class="text-2xl"></ion-icon>
      </div>
      <h2 class="text-2xl font-bold text-white">Security Update</h2>
      <p class="mt-2 text-sm text-slate-300 px-4">
        To secure your account, please update your password to continue.
      </p>
    </div>

    <!-- Form -->
    <form [formGroup]="forcePasswordForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div appFadeIn class="delay-1">
        <label for="newPassword" class="block text-sm font-medium text-slate-300 mb-1">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" class="form-input-dark" placeholder="Enter new password">
        <!-- Add password strength indicator here if desired later -->
        <div *ngIf="newPassword?.invalid && newPassword?.touched" class="mt-1 text-xs text-red-400">Min 6 characters required</div>
      </div>

      <div appFadeIn class="delay-2">
        <label for="confirmPassword" class="block text-sm font-medium text-slate-300 mb-1">Confirm New Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-input-dark" placeholder="Re-enter new password">
        <div *ngIf="confirmPassword?.errors?.['passwordMismatch'] && confirmPassword?.touched" class="mt-1 text-xs text-red-400">Passwords do not match</div>
      </div>

      <div *ngIf="error" class="bg-red-900/30 border border-red-700 rounded text-red-200 text-sm p-2 text-center" appFadeIn>
        {{ error }}
      </div>

      <div appFadeIn class="delay-3 pt-2">
        <button type="submit" [disabled]="isLoading" class="btn-primary-glow disabled:opacity-50">
          <span *ngIf="!isLoading">Update & Continue</span>
          <span *ngIf="isLoading"><ion-icon name="sync" class="animate-spin"></ion-icon> Updating...</span>
        </button>
      </div>
    </form>

    <div appFadeIn class="delay-3 text-center mt-4">
        <p class="text-xs text-slate-500 flex items-center justify-center gap-1">
            <ion-icon name="lock-closed-outline"></ion-icon> Mandatory security step
        </p>
    </div>
  </div>
</div>
