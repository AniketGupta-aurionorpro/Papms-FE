<div class="auth-centered-page">
  <div class="auth-content">

    <!-- Header -->
    <div class="text-center mb-8" appFadeIn>
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-slate-800 text-cyan-400 mb-4 border border-slate-700">
        <ion-icon name="key-outline" class="text-2xl"></ion-icon>
      </div>
      <h2 class="text-2xl font-bold text-white">Forgot password?</h2>
      <p class="mt-2 text-sm text-slate-400">No worries, we'll send you reset instructions.</p>
    </div>

    <!-- Success State -->
    <div *ngIf="success" appFadeIn class="bg-green-900/30 border border-green-600 rounded-lg p-4 text-center">
      <ion-icon name="mail-unread-outline" class="text-green-400 text-3xl mb-2"></ion-icon>
      <h3 class="text-lg font-medium text-white">Check your email</h3>
      <p class="text-sm text-slate-300 mt-1">If an account exists for that email, a password reset link has been sent.</p>
    </div>

    <!-- Form -->
    <form *ngIf="!success" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div appFadeIn class="delay-1">
        <label for="email" class="block text-sm font-medium text-slate-300 mb-1">Email address</label>
        <input id="email" type="email" formControlName="email" class="form-input-dark" placeholder="Enter your email">
        <div *ngIf="email?.invalid && email?.touched" class="mt-1 text-xs text-red-400">
          A valid email address is required.
        </div>
      </div>

      <div *ngIf="error" class="text-sm text-red-400 text-center" appFadeIn>
        {{ error }}
      </div>

      <div appFadeIn class="delay-2">
        <button type="submit" [disabled]="isLoading" class="btn-primary-glow disabled:opacity-50">
          <span *ngIf="!isLoading">Send Reset Link</span>
          <span *ngIf="isLoading"><ion-icon name="sync" class="animate-spin"></ion-icon> Sending...</span>
        </button>
      </div>
    </form>

    <!-- Back to Login -->
    <div appFadeIn class="delay-3 text-center mt-6">
      <a routerLink="/auth/login" class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center justify-center gap-2">
        <ion-icon name="arrow-back"></ion-icon> Back to log in
      </a>
    </div>
  </div>
</div>
