<div class="auth-centered-page">
  <div class="auth-content">

    <!-- Header -->
    <div class="text-center mb-8" appFadeIn>
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-slate-800 text-cyan-400 mb-4 border border-slate-700">
        <ion-icon name="lock-open-outline" class="text-2xl"></ion-icon>
      </div>
      <h2 class="text-2xl font-bold text-white">Set new password</h2>
      <p class="mt-2 text-sm text-slate-400">Your new password must be at least 6 characters long.</p>
    </div>

    <!-- Invalid Token or Error State -->
    <div *ngIf="!token || (error && !isLoading)" appFadeIn class="text-center">
      <div class="bg-red-900/30 border border-red-600 rounded-lg p-4 mb-4">
        <p class="text-red-200 text-sm">{{ error }}</p>
      </div>
      <a routerLink="/auth/forgot-password" class="text-sm font-medium text-cyan-400 hover:text-cyan-300">
        Request a new link
      </a>
    </div>

    <!-- Success State -->
    <div *ngIf="success" appFadeIn class="text-center py-4">
      <ion-icon name="checkmark-circle-outline" class="text-green-400 text-4xl mb-2"></ion-icon>
      <h3 class="text-xl font-bold text-white">Password Reset!</h3>
      <p class="text-sm text-slate-400 mt-2">Your password has been changed successfully. Redirecting to login...</p>
    </div>

    <!-- Form -->
    <form *ngIf="token && !success && !error" [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div appFadeIn class="delay-1">
        <label for="newPassword" class="block text-sm font-medium text-slate-300 mb-1">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" class="form-input-dark" placeholder="Enter new password">
        <div *ngIf="newPassword?.invalid && newPassword?.touched" class="mt-1 text-xs text-red-400">
          <span *ngIf="newPassword?.errors?.['required']">Password is required.</span>
          <span *ngIf="newPassword?.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>

      <div appFadeIn class="delay-2">
        <label for="confirmPassword" class="block text-sm font-medium text-slate-300 mb-1">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-input-dark" placeholder="Re-enter new password">
        <div *ngIf="confirmPassword?.touched && resetPasswordForm.errors?.['passwordMismatch']" class="mt-1 text-xs text-red-400">
          Passwords do not match.
        </div>
      </div>

      <div appFadeIn class="delay-3 pt-2">
        <button type="submit" [disabled]="isLoading" class="btn-primary-glow disabled:opacity-50">
          <span *ngIf="!isLoading">Reset Password</span>
          <span *ngIf="isLoading"><ion-icon name="sync" class="animate-spin"></ion-icon> Resetting...</span>
        </button>
      </div>
    </form>

    <div *ngIf="token && !success && !error" appFadeIn class="delay-3 text-center mt-6">
        <a routerLink="/auth/login" class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center justify-center gap-2">
          <ion-icon name="arrow-back"></ion-icon> Back to log in
        </a>
    </div>
  </div>
</div>
