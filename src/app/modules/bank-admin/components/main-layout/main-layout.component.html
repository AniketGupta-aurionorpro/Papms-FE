<div class="flex h-screen bg-slate-900 text-slate-300">
  <!-- Sidebar -->
  <aside class="w-64 flex-shrink-0 bg-slate-800 p-4 flex flex-col justify-between">
    <div>
      <!-- Logo and Title -->
      <div class="flex items-center gap-3 px-2 py-3 mb-6">
        <div class="h-8 w-8 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center">
          <ion-icon name="shield-checkmark-outline" class="text-white text-lg"></ion-icon>
        </div>
        <h2 class="text-xl font-bold text-white">Acme Bank Admin</h2>
      </div>

      <!-- Navigation Menu -->
      <nav class="flex flex-col gap-2">
        <a *ngFor="let item of navigationItems"
           [routerLink]="item.route"
           routerLinkActive="bg-blue-600 text-white shadow-lg"
           [routerLinkActiveOptions]="{ exact: item.route === '/bank-admin/dashboard' }"
           class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-700 transition-colors duration-200">
          <ion-icon [name]="item.icon" class="text-xl"></ion-icon>
          <span class="font-medium">{{ item.label }}</span>
        </a>
      </nav>
    </div>

    <!-- Logout Button -->
    <div class="px-2">
      <button (click)="logout()"
              class="flex items-center gap-3 w-full px-4 py-3 rounded-lg text-slate-400 hover:bg-red-800/50 hover:text-red-300 transition-colors duration-200">
        <ion-icon name="log-out-outline" class="text-xl"></ion-icon>
        <span class="font-medium">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-slate-900">
    <div class="p-6 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
