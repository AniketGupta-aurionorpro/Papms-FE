<div class="space-y-6">
  <!-- Page Header (Unchanged) -->
  <div class="bg-slate-800 rounded-xl shadow-sm border border-slate-700 p-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-white">Reports & Analytics</h1>
        <p class="text-slate-400 mt-1">Generate and download comprehensive system reports</p>
      </div>
      <div class="flex items-center space-x-4">
        <div class="h-12 w-12 bg-gradient-to-r from-blue-500 to-cyan-600 rounded-xl flex items-center justify-center">
          <ion-icon name="bar-chart-outline" class="text-white text-xl"></ion-icon>
        </div>
      </div>
    </div>
  </div>

  <!-- Report Generator -->
  <div class="bg-slate-800 rounded-xl shadow-sm border border-slate-700 p-6">
    <h3 class="text-lg font-semibold text-white mb-6 flex items-center">
      <ion-icon name="add-circle-outline" class="mr-2 text-blue-400"></ion-icon>
      Generate New Report
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
      <!-- Report Type -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Report Type</label>
        <select
          [(ngModel)]="selectedReportType"
          class="block w-full bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 py-2 px-3 transition"
        >
          <option *ngFor="let type of reportTypes" [value]="type.value">
            {{ type.label }}
          </option>
        </select>
      </div>

      <!-- Date Range -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Date Range</label>
        <select
          [(ngModel)]="dateRange"
          [disabled]="isDateRangeDisabled()"
          class="block w-full bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 py-2 px-3 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <option *ngFor="let range of dateRanges" [value]="range.value">
            {{ range.label }}
          </option>
        </select>
      </div>

      <!-- Organization -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Organization</label>
        <select
          [(ngModel)]="organizationId"
          [disabled]="isOrganizationDisabled()"
          class="block w-full bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 py-2 px-3 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <option value="ALL">All Organizations</option>
          <option *ngFor="let org of organizations" [value]="org.id">
            {{ org.companyName }}
          </option>
        </select>
      </div>

      <!-- Generate Button -->
      <div class="lg:col-span-1">
        <button
          (click)="generateReport()"
          [disabled]="isLoading"
          class="w-full inline-flex items-center justify-center px-6 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <ion-icon [name]="isLoading ? 'refresh-outline' : 'download-outline'" class="mr-2" [class.animate-spin]="isLoading"></ion-icon>
          {{ isLoading ? 'Generating...' : 'Generate Report' }}
        </button>
      </div>
    </div>

    <!-- Custom Date Range -->
    <div *ngIf="dateRange === 'CUSTOM' && !isDateRangeDisabled()" class="mt-4 max-w-sm">
        <label class="block text-sm font-medium text-slate-300 mb-2">Custom Range</label>
        <div class="flex space-x-2">
          <input
            type="date"
            [(ngModel)]="customStartDate"
            class="flex-1 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 py-2 px-3 transition"
            placeholder="Start Date"
          >
          <input
            type="date"
            [(ngModel)]="customEndDate"
            class="flex-1 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 py-2 px-3 transition"
            placeholder="End Date"
          >
        </div>
      </div>

    <!-- Error Message -->
    <div *ngIf="error" class="mt-4 text-sm text-red-400 bg-red-900/30 border border-red-700 p-3 rounded-md">
      {{ error }}
    </div>
  </div>

  <!-- Quick Report Types (Unchanged) -->
  <div class="bg-slate-800 rounded-xl shadow-sm border border-slate-700">
    <div class="px-6 py-5 border-b border-slate-700 bg-gradient-to-r from-slate-700 to-slate-800">
      <h3 class="text-lg font-semibold text-white flex items-center">
        <ion-icon name="flash-outline" class="mr-2 text-blue-400"></ion-icon>
        Quick Select
      </h3>
    </div>
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6">
        <div
          *ngFor="let reportType of reportTypes"
          (click)="selectedReportType = reportType.value"
          [class]="'flex flex-col items-center text-center p-6 border-2 border-dashed rounded-xl hover:border-blue-400 hover:bg-blue-500/10 transition-all duration-200 cursor-pointer group ' +
            (selectedReportType === reportType.value ? 'border-blue-400 bg-blue-500/10' : 'border-slate-600')"
        >
          <div [class]="'h-16 w-16 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform ' +
            (selectedReportType === reportType.value ? 'bg-blue-500' : 'bg-slate-700')">
            <ion-icon [name]="reportType.icon" class="text-white text-2xl"></ion-icon>
          </div>
          <h4 class="text-lg font-semibold text-white">{{ reportType.label }}</h4>
        </div>
      </div>
    </div>
  </div>

</div>
