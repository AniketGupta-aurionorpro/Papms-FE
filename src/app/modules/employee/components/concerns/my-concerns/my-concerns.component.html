<!-- My Concerns Page -->
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">My Concerns</h1>
            <p class="text-slate-400 mt-1">Track and manage your submitted concerns</p>
        </div>
        <button (click)="raiseConcern()"
            class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-lg text-white font-medium transition-all shadow-lg shadow-cyan-500/20 self-start md:self-auto">
            <ion-icon name="add-circle-outline" class="text-lg"></ion-icon>
            Raise New Concern
        </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex items-center justify-center min-h-[300px]">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent">
            </div>
            <p class="mt-4 text-slate-400">Loading concerns...</p>
        </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !isLoading" class="bg-red-900/30 border border-red-700 rounded-xl p-6 text-center">
        <ion-icon name="alert-circle-outline" class="text-4xl text-red-400 mb-2"></ion-icon>
        <p class="text-red-300">{{ error }}</p>
    </div>

    <!-- Content -->
    <div *ngIf="!isLoading && !error">
        <!-- Empty State -->
        <div *ngIf="concerns.length === 0"
            class="bg-gradient-to-br from-slate-800 to-slate-800/50 rounded-2xl p-12 border border-slate-700/50 text-center">
            <ion-icon name="chatbubble-ellipses-outline" class="text-6xl text-slate-600 mb-4"></ion-icon>
            <h3 class="text-xl font-semibold text-white mb-2">No Concerns Raised</h3>
            <p class="text-slate-400 mb-6">You haven't raised any concerns yet.</p>
            <button (click)="raiseConcern()"
                class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-lg text-white font-medium transition-all shadow-lg shadow-cyan-500/20">
                Raise Your First Concern
            </button>
        </div>

        <!-- Concerns List -->
        <div *ngIf="concerns.length > 0" class="space-y-4">
            <div *ngFor="let concern of concerns" (click)="viewConcern(concern.id)"
                class="bg-gradient-to-br from-slate-800 to-slate-800/50 rounded-xl p-5 border border-slate-700/50 hover:border-cyan-700/50 cursor-pointer transition-all hover:shadow-lg hover:shadow-cyan-500/10">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <ion-icon [name]="getStatusIcon(concern.status)"
                                [class]="'text-xl ' + (getStatusClass(concern.status).includes('blue') ? 'text-blue-400' : getStatusClass(concern.status).includes('yellow') ? 'text-yellow-400' : getStatusClass(concern.status).includes('green') ? 'text-green-400' : 'text-slate-400')"></ion-icon>
                            <h3 class="text-lg font-semibold text-white">{{ concern.subject }}</h3>
                        </div>
                        <p class="text-slate-400 text-sm line-clamp-2">{{ concern.description }}</p>
                        <div class="flex items-center gap-4 mt-3 text-xs text-slate-500">
                            <span class="flex items-center gap-1">
                                <ion-icon name="calendar-outline"></ion-icon>
                                {{ concern.createdAt | date:'medium' }}
                            </span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span
                            [class]="'px-3 py-1 rounded-full text-xs font-medium border ' + getStatusClass(concern.status)">
                            {{ concern.status }}
                        </span>
                        <ion-icon name="chevron-forward-outline" class="text-slate-400"></ion-icon>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
