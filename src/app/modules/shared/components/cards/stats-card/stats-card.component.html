<div class="bg-slate-800 rounded-xl p-6 border border-slate-700/50 hover:-translate-y-1 transition-transform duration-300 shadow-lg hover:shadow-blue-900/20">
  <div class="flex justify-between items-center">
    <!-- Left Side: Title, Value, Trend -->
    <div>
      <p class="text-sm font-medium text-slate-400">{{ title }}</p>
      <p class="text-3xl font-bold text-white mt-2">{{ value }}</p>
      <p *ngIf="trend" [class]="trendColor" class="text-sm font-medium mt-2 flex items-center gap-1">
        <ion-icon [name]="getTrendIcon()" class="text-base"></ion-icon>
        {{ trend }}
      </p>
    </div>

    <!-- Right Side: Icon -->
    <div *ngIf="icon" [class]="iconBgClass" class="h-12 w-12 rounded-lg flex items-center justify-center text-white text-xl flex-shrink-0">
      <ion-icon [name]="icon"></ion-icon>
    </div>
  </div>
</div>
