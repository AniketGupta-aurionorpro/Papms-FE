<div *ngIf="isVisible" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60" (click)="onClose()">
  <div class="bg-slate-800 rounded-lg shadow-xl w-full max-w-lg p-6 m-4" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-700">
      <h3 class="text-xl font-bold text-white flex items-center gap-2">
        <ion-icon name="close-circle-outline" class="text-red-400"></ion-icon>
        Rejection Reason
      </h3>
      <button (click)="onClose()" class="p-1 rounded-full text-slate-400 hover:bg-slate-700">
        <ion-icon name="close-outline" class="text-2xl"></ion-icon>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="rejectionForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">
      <div>
        <label for="reason" class="block text-sm font-medium text-slate-300 mb-1">Select a reason</label>
        <select id="reason" formControlName="reason" class="form-input-dark w-full">
          <option *ngFor="let reason of rejectionReasons" [value]="reason">{{ reason }}</option>
        </select>
      </div>

      <div *ngIf="showCustomReason">
        <label for="customReason" class="block text-sm font-medium text-slate-300 mb-1">Please specify the reason</label>
        <textarea id="customReason" formControlName="customReason" rows="3" class="form-input-dark w-full" placeholder="Enter detailed reason for rejection..."></textarea>
        <div *ngIf="rejectionForm.get('customReason')?.invalid && rejectionForm.get('customReason')?.touched" class="mt-1 text-xs text-red-400">
          A detailed reason (min. 10 characters) is required.
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4">
        <button type="button" (click)="onClose()" class="px-4 py-2 text-sm font-semibold rounded-lg text-slate-300 bg-slate-700 hover:bg-slate-600 transition">
          Cancel
        </button>
        <button type="submit" [disabled]="rejectionForm.invalid" class="px-4 py-2 text-sm font-semibold rounded-lg text-white bg-red-600 hover:bg-red-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
          Reject Document
        </button>
      </div>
    </form>
  </div>
</div>
