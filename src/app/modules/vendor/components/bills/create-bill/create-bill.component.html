<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-4">
        <a routerLink="/vendor/dashboard"
            class="h-10 w-10 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center text-slate-400 hover:text-white transition-colors">
            <ion-icon name="arrow-back-outline" class="text-xl"></ion-icon>
        </a>
        <div>
            <h1 class="text-3xl font-bold text-white">Create New Bill</h1>
            <p class="text-slate-400 mt-1">Submit a bill to your organization</p>
        </div>
    </div>

    <!-- Bill Form -->
    <form [formGroup]="billForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Bill Description -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
            <div class="flex items-center gap-3 mb-6">
                <div class="h-10 w-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                    <ion-icon name="document-text-outline" class="text-blue-400 text-xl"></ion-icon>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-white">Bill Details</h2>
                    <p class="text-sm text-slate-400">General information about the bill</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Description *</label>
                    <textarea formControlName="description" rows="3" placeholder="Describe what this bill is for..."
                        [class.border-red-500]="isFieldInvalid('description')"
                        class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none"></textarea>
                    <p *ngIf="isFieldInvalid('description')" class="text-xs text-red-400 mt-1">Description is required
                        (min 10 characters)</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Due Date *</label>
                    <input type="date" formControlName="dueDate" [class.border-red-500]="isFieldInvalid('dueDate')"
                        class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Line Items -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="h-10 w-10 bg-purple-500/20 rounded-lg flex items-center justify-center">
                        <ion-icon name="list-outline" class="text-purple-400 text-xl"></ion-icon>
                    </div>
                    <div>
                        <h2 class="text-lg font-semibold text-white">Bill Items</h2>
                        <p class="text-sm text-slate-400">Add items with quantity and price</p>
                    </div>
                </div>
                <button type="button" (click)="addItem()"
                    class="flex items-center gap-2 px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm transition-colors">
                    <ion-icon name="add-outline"></ion-icon>
                    Add Item
                </button>
            </div>

            <!-- Items Table -->
            <div class="space-y-3" formArrayName="items">
                <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i"
                    class="bg-slate-700/50 rounded-lg p-4">
                    <div class="grid grid-cols-12 gap-4 items-end">
                        <!-- Description -->
                        <div class="col-span-12 sm:col-span-5">
                            <label class="block text-xs text-slate-400 mb-1">Item Description</label>
                            <input type="text" formControlName="description" placeholder="e.g., Consulting Services"
                                class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Quantity -->
                        <div class="col-span-4 sm:col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Qty</label>
                            <input type="number" formControlName="quantity" min="1"
                                class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm text-center focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Unit Price -->
                        <div class="col-span-4 sm:col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Unit Price (₹)</label>
                            <input type="number" formControlName="unitPrice" min="0"
                                class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white text-sm text-right focus:ring-2 focus:ring-blue-500">
                        </div>

                        <!-- Amount -->
                        <div class="col-span-3 sm:col-span-2">
                            <label class="block text-xs text-slate-400 mb-1">Amount</label>
                            <div
                                class="px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white text-sm text-right font-semibold">
                                {{ formatCurrency(getItemAmount(i)) }}
                            </div>
                        </div>

                        <!-- Remove -->
                        <div class="col-span-1 flex justify-center">
                            <button type="button" (click)="removeItem(i)" [disabled]="items.length <= 1"
                                class="p-2 text-red-400 hover:bg-red-500/20 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                                <ion-icon name="trash-outline"></ion-icon>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Total -->
            <div class="mt-6 pt-4 border-t border-slate-700 flex justify-end">
                <div class="bg-slate-700 rounded-lg px-6 py-3">
                    <span class="text-slate-400 text-sm">Total Amount:</span>
                    <span class="text-2xl font-bold text-white ml-3">{{ formatCurrency(getTotalAmount()) }}</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-4">
            <a routerLink="/vendor/dashboard"
                class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors">
                Cancel
            </a>
            <button type="submit" [disabled]="isSubmitting"
                class="flex items-center gap-2 px-6 py-2 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-lg hover:from-blue-500 hover:to-blue-400 transition-all disabled:opacity-50 font-medium">
                <ion-icon [name]="isSubmitting ? 'sync-outline' : 'checkmark-outline'"
                    [class.animate-spin]="isSubmitting"></ion-icon>
                {{ isSubmitting ? 'Submitting...' : 'Submit Bill' }}
            </button>
        </div>
    </form>
</div>
