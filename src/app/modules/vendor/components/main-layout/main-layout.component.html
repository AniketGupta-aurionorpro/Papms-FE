<div class="flex h-screen bg-slate-900 text-slate-300">
    <!-- Sidebar -->
    <aside [class]="isSidebarOpen ? 'w-64' : 'w-20'"
        class="bg-slate-800 border-r border-slate-700 flex flex-col transition-all duration-300">
        <!-- Logo Header -->
        <div class="p-4 flex items-center justify-between h-16 border-b border-slate-700">
            <div class="flex items-center gap-3" *ngIf="isSidebarOpen">
                <div
                    class="h-9 w-9 bg-gradient-to-br from-purple-600 to-purple-500 rounded-lg flex items-center justify-center">
                    <ion-icon name="storefront-outline" class="text-white text-lg"></ion-icon>
                </div>
                <span class="text-lg font-bold text-white">Vendor Portal</span>
            </div>
            <button (click)="toggleSidebar()" class="p-2 hover:bg-slate-700 rounded-lg transition-colors">
                <ion-icon [name]="isSidebarOpen ? 'chevron-back-outline' : 'chevron-forward-outline'"
                    class="text-slate-400"></ion-icon>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-grow p-3 space-y-1">
            <a *ngFor="let item of menuItems" [routerLink]="item.route"
                [class]="isMenuItemActive(item) ? 'bg-blue-600/20 text-blue-400 border-l-2 border-blue-400' : 'text-slate-400 hover:bg-slate-700/50 hover:text-white'"
                class="flex items-center gap-3 p-3 rounded-lg transition-all">
                <ion-icon [name]="item.icon" class="text-xl"></ion-icon>
                <span *ngIf="isSidebarOpen" class="text-sm font-medium">{{ item.label }}</span>
            </a>
        </nav>

        <!-- User Profile -->
        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3">
                <div
                    class="h-10 w-10 bg-gradient-to-br from-purple-600 to-purple-500 rounded-lg flex items-center justify-center text-white font-bold">
                    {{ getInitials(userInfo?.fullName) }}
                </div>
                <div *ngIf="isSidebarOpen" class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-white truncate">{{ userInfo?.fullName || 'Vendor' }}</p>
                    <p class="text-xs text-slate-500 truncate">{{ userInfo?.email }}</p>
                </div>
                <button (click)="logout()" class="p-2 text-slate-400 hover:text-red-400 transition-colors">
                    <ion-icon name="log-out-outline" class="text-xl"></ion-icon>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center px-6 justify-between">
            <h1 class="text-xl font-semibold text-white">Vendor Portal</h1>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto p-6 bg-slate-900">
            <router-outlet></router-outlet>

            <footer class="mt-8 text-center">
                <p class="text-sm text-slate-600">© 2024 Payroll & Payment Management System</p>
            </footer>
        </main>
    </div>
</div>
